<div class="minimal-container">
  
  <header class="minimal-header">
    <div class="header-titles">
      <h1>Configuración</h1>
    </div>
    <button class="btn-save" (click)="guardarConfiguracion()" [disabled]="estaCargando()">
      {{ estaCargando() ? '⏳ Guardando...' : '💾 Guardar Cambios' }}
    </button>
  </header>

  <section class="settings-section">
    <h2>Mínimos de Compra</h2>
    
    <div class="setting-row">
      <div class="setting-info">
        <label>Mínimo General/{{ escala1_nombre() }}</label>
        <span>Aplica para pedidos que NO contienen combos.</span>
      </div>
      <div class="setting-input-group">
        <span class="currency-symbol">Desde $</span>
        <input type="text" 
               [value]="formatearNumero(minimoGeneral())" 
               (blur)="actualizarValor($event, minimoGeneral)" 
               class="minimal-input shortInput">
      </div>
    </div>

    <div class="setting-row">
      <div class="setting-info">
        <label>Mínimo con Combos</label>
        <span>Aplica si el cliente agrega al menos 1 combo al carrito.</span>
      </div>
      <div class="setting-input-group">
        <span class="currency-symbol">Desde $</span>
        <input type="text" 
               [value]="formatearNumero(minimoConCombos())" 
               (blur)="actualizarValor($event, minimoConCombos)" 
               class="minimal-input shortInput">
      </div>
    </div>
  </section>

  <section class="settings-section">
    <h2>Escalas de Precio</h2>
    
    <div class="setting-row">
      <div class="setting-info">
        <label>Nivel 1 (mínimo general)</label>
        <span>Es el precio por defecto.</span>
      </div>
      <div class="setting-input-group">
        <span class="currency-symbol">Nombre: </span>
        <input type="text" 
               [ngModel]="escala1_nombre()" 
               (ngModelChange)="escala1_nombre.set($event)" 
               placeholder="Ej: Precio Base"
               class="minimal-input shortInput">
      </div>
    </div>

    <div class="setting-row">
      <div class="setting-info">
        <label>Nivel 2</label>
        <span>Segunda escala de precios.</span>
      </div>
      <div class="setting-inputs-multiple">
        <div class="setting-input-group">
          <span class="currency-symbol">Nombre: </span>
          <input type="text" 
                 [ngModel]="escala2_nombre()" 
                 (ngModelChange)="escala2_nombre.set($event)" 
                 placeholder="Nombre Nivel 2"
                 class="minimal-input">
        </div>
        <div class="setting-input-group highlight-group">
          <span class="currency-symbol">Desde $</span>
          <input type="text" 
                 [value]="formatearNumero(escala2_minimo())" 
                 (blur)="actualizarValor($event, escala2_minimo)" 
                 class="minimal-input text-right">
        </div>
      </div>
    </div>

    <div class="setting-row">
      <div class="setting-info">
        <label>Nivel 3</label>
        <span>Tercera escala de precios</span>
      </div>
      <div class="setting-inputs-multiple">
        
        <div class="setting-input-group">
          <span class="currency-symbol">Nombre: </span>
          <input type="text" 
                 [ngModel]="escala3_nombre()" 
                 (ngModelChange)="escala3_nombre.set($event)" 
                 placeholder="Nombre Nivel 3"
                 class="minimal-input">
        </div>
        <div class="setting-input-group highlight-group">
          <span class="currency-symbol">Desde $</span>
          <input type="text" 
                 [value]="formatearNumero(escala3_minimo())" 
                 (blur)="actualizarValor($event, escala3_minimo)" 
                 class="minimal-input text-right">
        </div>
      </div>
    </div>

  </section>

</div>
